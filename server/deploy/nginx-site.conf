# nginx site for running Fitmeasure behind an existing nginx, which then owns
# ports 80 and 443. Install as /etc/nginx/sites-available/live.somto.si, link
# it into sites-enabled, then run `certbot --nginx -d live.somto.si` to add
# HTTPS. Media (UDP 7882, TCP 7881) and TURN (3478) bypass nginx entirely.
server {
    listen 80;
    listen [::]:80;
    server_name live.somto.si;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        # Signalling runs over WebSockets.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A quiet session sends only keep-alive pings, every 25 seconds.
        proxy_read_timeout 120s;
    }
}
