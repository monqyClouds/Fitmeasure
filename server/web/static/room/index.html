<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live room · Fitmeasure</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <nav><a href="/echo/">1. Echo</a><a href="/room/" aria-current="page">2. Rooms</a></nav>
    <h1 id="title">Live room</h1>
    <p id="subtitle">Up to 16 people train together over video. Create a room
      and share its link, or join one with its ID.</p>
    <div id="share" class="controls" hidden>
      <span class="room-id">Room ID <strong id="room-id"></strong></span>
      <button id="copy-link" type="button" class="toggle">Copy link</button>
      <a id="open-app" class="button-link" hidden>Open in the app</a>
    </div>
  </header>

  <main>
    <div id="lobby" hidden>
      <form id="create" class="controls">
        <label>New room <input id="new-name" maxlength="60" placeholder="Tuesday HIIT" required></label>
        <button type="submit">Create room</button>
      </form>
      <form id="find" class="controls">
        <label>Room ID or link <input id="find-id" placeholder="k7f3qz" required></label>
        <button type="submit" class="toggle">Go to room</button>
      </form>
    </div>

    <form id="join" class="controls" hidden>
      <label>Name <input id="name" autocomplete="nickname" maxlength="40" required></label>
      <label><input type="checkbox" id="audio" checked> Microphone</label>
      <label title="Send everything through the TURN server, to test it"><input type="checkbox" id="relay"> Relay only</label>
      <button id="start" type="submit">Join</button>
      <button id="mic" type="button" class="toggle" hidden>Mute</button>
      <button id="cam" type="button" class="toggle" hidden>Camera off</button>
      <button id="stop" type="button" disabled>Leave</button>
    </form>

    <div id="room-options" class="controls" hidden>
      <label id="lock-option"><input type="checkbox" id="lock"> Lock room</label>
      <label id="everyone-option"><input type="checkbox" id="everyone"> Everyone can moderate</label>
      <label title="Your video goes to the host alone; everyone still hears you"><input type="checkbox" id="trainer-only"> Only the host sees my video</label>
    </div>

    <div id="prompt" class="prompt" hidden>
      <span id="prompt-text"></span>
      <button id="prompt-yes" type="button">Unmute</button>
      <button id="prompt-no" type="button" class="toggle">Not now</button>
    </div>

    <div id="workout" class="workout" hidden>
      <div class="workout-time" id="workout-time"></div>
      <div class="workout-what">
        <span class="workout-kind" id="workout-kind"></span>
        <strong id="workout-title"></strong>
        <span id="workout-detail"></span>
        <small id="workout-next"></small>
      </div>
      <div class="workout-controls" id="workout-controls" hidden>
        <button type="button" class="toggle" data-action="prev">◀</button>
        <button type="button" id="workout-play" data-action="start">Start</button>
        <button type="button" class="toggle" data-action="next">▶</button>
        <button type="button" class="toggle" data-action="break">Water break</button>
        <button type="button" class="toggle" data-action="stop">End</button>
      </div>
    </div>

    <div id="tiles" class="videos"></div>

    <section>
      <h2>Connection</h2>
      <dl id="stats" class="stats"></dl>
    </section>

    <section>
      <h2>What happened</h2>
      <ol id="log" class="log"></ol>
    </section>
  </main>

  <script src="/room/room.js"></script>
</body>
</html>
